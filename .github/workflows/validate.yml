name: Validate and deploy recipes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recipes-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned CookCLI
        run: |
          curl -fsSL https://github.com/cooklang/cookcli/releases/download/v0.41.1/cook-0.41.1-linux-x86_64-musl.tar.gz -o "$RUNNER_TEMP/cook.tar.gz"
          echo "342378f8121ba8b12cb13654119348860001bb3ab07ca00ba65f59ad00b51354  $RUNNER_TEMP/cook.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/cook.tar.gz" -C "$RUNNER_TEMP" cook
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate recipes
        run: cook doctor validate --base-path recipes --strict
      - name: Build default CookCLI site
        run: cook build web "$RUNNER_TEMP/site" --base-path recipes --base-url /recipes/ --repo-url "https://github.com/${{ github.repository }}"
      - name: Upload website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: recipes
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
