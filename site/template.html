<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <title>$title · The Recipe Box</title>
  <link rel="stylesheet" href="$style_href">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="$index_href" aria-label="The Recipe Box home">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span class="brand-name">The Recipe Box</span>
      </a>
      <nav class="top-nav" aria-label="Recipe links">
        <a class="back-link" href="$index_href"><span aria-hidden="true">←</span> All recipes</a>
        <a class="source-link" href="$source_href">View source <span aria-hidden="true">↗</span></a>
      </nav>
    </header>

    <main>
      <article class="recipe-card">
        <header class="recipe-intro">
          <p class="eyebrow"><span class="eyebrow-rule" aria-hidden="true"></span> From the kitchen</p>
          <h1>$title</h1>
          <p class="description">$description</p>
          <div class="tag-list" aria-label="Recipe tags">$tags</div>
          <div class="intro-rule" aria-hidden="true"><span></span></div>
        </header>

        <div class="recipe-layout">
          <aside class="ingredients-panel" aria-labelledby="ingredients-heading">
            <div class="section-heading">
              <span class="section-number" aria-hidden="true">01</span>
              <h2 id="ingredients-heading">Ingredients</h2>
            </div>
            <p class="section-hint">Gather everything before you begin.</p>
            <ul class="ingredients-list">$ingredients</ul>
          </aside>

          <section class="method-panel" aria-labelledby="method-heading">
            <div class="section-heading">
              <span class="section-number" aria-hidden="true">02</span>
              <h2 id="method-heading">Method</h2>
            </div>
            <ol class="steps-list">$steps</ol>
            <section class="notes-panel" aria-labelledby="notes-heading">
              <h2 id="notes-heading"><span aria-hidden="true">✳</span> A note from the cook</h2>
              <div class="notes-content">$notes</div>
            </section>
          </section>
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <a class="footer-source" href="$source_href">Read the Cooklang source <span aria-hidden="true">↗</span></a>
      <span class="footer-separator" aria-hidden="true">·</span>
      <a href="$index_href">Back to the collection</a>
      <button class="print-button" type="button" onclick="window.print()"><span aria-hidden="true">⌁</span> Print recipe</button>
    </footer>
  </div>
</body>
</html>
